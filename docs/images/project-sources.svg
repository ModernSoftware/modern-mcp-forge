<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" width="640" height="258" role="img" aria-labelledby="title desc">
  <title id="title">Forge project sources</title>
  <desc id="desc">An MCP client connects to Forge. Native calls reach Node or Python workers through MCPack. Bridged calls reach an application through its adapter. External calls reach a remote HTTP server.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5c6983"/></marker></defs>
  <rect width="640" height="258" rx="12" fill="#eef2f7"/>
  <g fill="none" stroke="#5c6983" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M320 48v23"/><path d="M320 109v16H115v22"/><path d="M320 109v38"/><path d="M320 109v16h205v22"/>
    <path d="M115 185v23"/><path d="M320 185v23"/>
  </g>
  <g fill="#fff" stroke="#9ba9be">
    <rect x="227" y="10" width="186" height="38" rx="8"/><rect x="227" y="71" width="186" height="38" rx="8" fill="#e2e7ff"/>
    <rect x="22" y="147" width="186" height="38" rx="8"/><rect x="227" y="147" width="186" height="38" rx="8"/><rect x="432" y="147" width="186" height="38" rx="8"/>
    <rect x="22" y="208" width="186" height="38" rx="8"/><rect x="227" y="208" width="186" height="38" rx="8"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#202c43">
    <text x="320" y="34">Agent or Inspector</text><text x="320" y="95" font-weight="bold">Forge endpoint</text>
    <text x="115" y="171">Native MCPack source</text><text x="320" y="171">Bridge adapter</text><text x="525" y="171">External HTTP server</text>
    <text x="115" y="232">Node / Python workers</text><text x="320" y="232">Existing application</text>
  </g>
</svg>
