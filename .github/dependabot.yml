version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: v0.10.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /src/lib/server/deployment/template
    target-branch: v0.10.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    target-branch: v0.10.0
    schedule:
      interval: weekly
