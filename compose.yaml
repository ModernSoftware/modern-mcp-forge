services:
  forge:
    image: ${MCP_FORGE_IMAGE:-ghcr.io/modernsoftware/modern-mcp-forge:0.9.0}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_FORGE_PORT:-5173}:3000"
    environment:
      MCP_FORGE_DATA_DIR: /data
    volumes:
      - forge-data:/data
      - ${MCP_FORGE_PROJECTS_ROOT:-./projects}:/workspace

volumes:
  forge-data:
